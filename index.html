let UI = { selected:new Set(), view:null, seat:0, deadline:0, timerHandle:null };

function go(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  $('#' + id).classList.add('on');
}

function renderSeatList(seats, mySeat, gid, maxP, minP){
  const box = $('#seatList');
  if(!box) return;
  maxP = maxP || (gid ? GAMES[gid].maxP : 4);
  minP = minP || (gid ? GAMES[gid].minP : 2);

  if(NET.roomId){
    $('#roomCodeDisplay').value = NET.roomId;
    $('#roomHint').textContent = `把房间号「${NET.roomId}」告诉好友，让他们输入加入`;
  }

  const sorted = seats.slice().sort((a,b) => a.seat - b.seat);
  box.innerHTML = '';
  let readyCount = 0;
  let playerCount = 0;

  sorted.forEach(s => {
    const isMe = s.seat === mySeat;
    const d = document.createElement('div');
    d.className = 'seat' + (isMe ? ' me' : '');
    if(s.connected === false){
      d.classList.add('empty');
      d.innerHTML = `<div class="ico">✕</div>
        <div style="flex:1"><div class="nm" style="color:#8b949e">${s.name}</div><div class="sub">已断开</div></div>
        <div class="badge off">离线</div>`;
    } else {
      playerCount++;
      if(s.ready || s.ai) readyCount++;
      const initial = (s.name || '?').charAt(0).toUpperCase();
      let badge = '';
      if(s.ai) badge = '<span class="badge ai">🤖 AI</span>';
      else if(s.ready) badge = '<span class="badge ready">✓ 已准备</span>';
      else badge = '<span class="badge wait">等待准备</span>';
      const hostBadge = s.isHost ? '<span class="badge host">👑 房主</span>' : '';
      d.innerHTML = `
        <div class="ico">${s.ai ? '🤖' : initial}</div>
        <div style="flex:1;min-width:0">
          <div class="nm">${s.name}${isMe ? ' <span style="font-size:11px;color:#58a6ff">(你)</span>' : ''}</div>
          <div class="sub">座位 ${s.seat + 1}</div>
        </div>
        ${hostBadge}
        ${badge}
      `;
    }
    box.appendChild(d);
  });

  for(let i = sorted.length; i < maxP; i++){
    const d = document.createElement('div');
    d.className = 'seat empty';
    d.innerHTML = `<div class="ico">+</div>
      <div style="flex:1"><div class="nm" style="color:#484f58">等待加入…</div><div class="sub">把房间号分享给好友</div></div>
      <div class="badge wait">空位</div>`;
    box.appendChild(d);
  }

  $('#roomPlayersCount').textContent = `(${playerCount}/${maxP})`;
  if(mySeat === 0){
    $('#btnReady').textContent = '开始游戏';
    $('#btnReady').disabled = (playerCount < minP) || !sorted.every(s => s.ready || s.ai || s.connected === false);
  } else {
    $('#btnReady').textContent = '准备';
  }
}

function renderGame(view, mySeat, fullS, deadline){
  if(!view) return;
  UI.view = view; UI.seat = mySeat;
  if(deadline) UI.deadline = deadline;
  const gid = view.gid;
  go('scr-game');

  const names = view.names || ['P0','P1','P2','P3'];

  const seatsBox = $('#seats');
  seatsBox.innerHTML = '';
  const n = view.counts.length;
  for(let i=0;i<n;i++){
    if(i === mySeat) continue;
    const d = document.createElement('div');
    d.className = 'seat' + (view.turn===i ? ' cur' : '');
    let tags = '';
    if(gid==='ddz' && view.landlord===i) tags += '<span class="tag gold">地主</span>';
    if(gid==='gd') tags += `<span class="tag blue">${i%2===0?'A队':'B队'}</span>`;
    if(gid==='mj'){
      if(view.que && view.que[i]>=0) tags += `<span class="tag">缺${['万','条','筒'][view.que[i]]}</span>`;
      if(view.hu && view.hu[i]) tags += '<span class="tag green">已胡</span>';
    }
    if(gid==='tarot' && view.taker===i) tags += '<span class="tag gold">庄家</span>';
    if(gid==='uno' && view.uno && view.uno[i]) tags += '<span class="tag gold">UNO!</span>';
    d.innerHTML = `<div class="ico">${(names[i]||'?').charAt(0)}</div>
      <div style="flex:1;min-width:0">
        <div class="nm">${names[i]}${view.turn===i?' ⏳':''}</div>
        <div class="sub">手牌 ${view.counts[i]} 张</div>
      </div>${tags}`;
    seatsBox.appendChild(d);
  }

  const C = $('#centerCards');
  const CI = $('#centerInfo');
  C.innerHTML = '';
  CI.innerHTML = '';

  if(gid === 'mj'){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;gap:14px;flex-wrap:wrap;justify-content:center';
    for(let i=0;i<n;i++){
      if(i===mySeat) continue;
      const w = document.createElement('div');
      w.style.cssText = 'min-width:100px';
      w.innerHTML = `<div style="font-size:11px;color:#8b949e">${names[i]}</div>`;
      const row = document.createElement('div');
      row.className = 'card-list';
      (view.rivers[i]||[]).slice(-14).forEach(t => row.appendChild(cardEl(t, 'mj', { tiny:true })));
      w.appendChild(row);
      wrap.appendChild(w);
    }
    C.appendChild(wrap);
    CI.textContent = `牌墙 ${view.wall}`;
  } else if(gid === 'hearts'){
    if(view.trick.length){
      const d = document.createElement('div');
      d.innerHTML = `<div style="font-size:11px;color:#8b949e;text-align:center">本墩 ${view.trick.length}/4</div>`;
      const row = document.createElement('div');
      row.className = 'card-list';
      row.style.justifyContent = 'center';
      view.trick.forEach(t => {
        const wrap = document.createElement('div');
        wrap.style.cssText = 'text-align:center;margin:0 3px';
        wrap.appendChild(cardEl(t.id, 'hearts', {}));
        const lb = document.createElement('div');
        lb.style.cssText = 'font-size:10px;color:#8b949e';
        lb.textContent = names[t.seat];
        wrap.appendChild(lb);
        row.appendChild(wrap);
      });
      d.appendChild(row);
      C.appendChild(d);
    } else CI.textContent = '等待领出…';
    CI.innerHTML += `<br>总分：${view.scores.map((s,i)=>`${names[i]} ${s}`).join(' · ')}<br>
      <span style="color:#f0b429">本局：${view.roundScores.map((s,i)=>`${names[i]} ${s}`).join(' · ')} · ${view.heartsBroken?'红桃已破':'红桃未破'}</span>`;
  } else if(gid === 'uno'){
    const top = view.top;
    const colHex = view.currentColor >= 0 ? UNO_COLORS[view.currentColor] : '#888';
    const d = document.createElement('div');
    d.style.cssText = 'text-align:center';
    d.innerHTML = `<div style="display:inline-block;background:${colHex};border-radius:10px;padding:8px 16px;font-size:20px;font-weight:800;color:#fff;min-width:60px;box-shadow:0 4px 12px #0008">${unoLabel(top)}</div>`;
    C.appendChild(d);
    CI.innerHTML = `当前颜色：${view.currentColor>=0?UNO_CNAME[view.currentColor]:'—'} · 牌堆 ${view.deckCount} · ${view.dir>0?'↻':'↺'}<br>
      ${view.counts.map((c,i)=>`${names[i]} ${c}`).join(' · ')}`;
    if(view.lastPlayWasWild4){
      CI.innerHTML += `<br><span style="color:#da3633">⚠ ${names[view.lastWild4By]} 出了 +4，请选择接受或挑战！</span>`;
    }
  } else if(gid === 'tarot'){
    if(view.trick.length){
      const d = document.createElement('div');
      d.style.textAlign = 'center';
      d.innerHTML = `<div style="font-size:11px;color:#8b949e">本墩 ${view.trick.length}/4</div>`;
      const row = document.createElement('div');
      row.className = 'card-list';
      row.style.justifyContent = 'center';
      view.trick.forEach(t => {
        const wrap = document.createElement('div');
        wrap.style.cssText = 'text-align:center;margin:0 3px';
        wrap.appendChild(cardEl(t.id, 'tarot', {}));
        const lb = document.createElement('div');
        lb.style.cssText = 'font-size:10px;color:#8b949e';
        lb.textContent = names[t.seat];
        wrap.appendChild(lb);
        row.appendChild(wrap);
      });
      d.appendChild(row);
      C.appendChild(d);
    } else {
      CI.textContent = view.phase==='bid' ? '叫牌中…' : (view.phase==='discard' ? '庄家换底…' : '等待领出…');
    }
    if(view.taker >= 0){
      CI.innerHTML += `<br>庄家：${names[view.taker]} · ${CONTRACTS_TAROT[view.contract].name} · 已得 ${view.takerPoints.toFixed(1)} 分`;
    }
  } else {
    if(view.phase === 'bid') CI.textContent = '叫地主中…';
    else if(view.lastPlay){
      const d = document.createElement('div');
      d.style.textAlign = 'center';
      d.innerHTML = `<div style="font-size:11px;color:#8b949e">${names[view.lastPlay.seat]} 出牌</div>`;
      const row = document.createElement('div');
      row.className = 'card-list';
      row.style.justifyContent = 'center';
      view.lastPlay.ids.forEach(id => row.appendChild(cardEl(id, gid, { tiny:true })));
      d.appendChild(row);
      C.appendChild(d);
    } else CI.textContent = '等待出牌…';
    if(gid === 'gd') CI.innerHTML += `<br>级牌：${view.level}`;
    if(gid === 'pdk' && view.mustSpade3) CI.innerHTML += `<br><span style="color:#f0b429">首出必须包含 ♠3</span>`;
  }

  const H = $('#handWrap');
  H.innerHTML = '';
  if(gid === 'uno'){
    (view.hand || []).forEach(card => {
      const el = cardEl(card.id, 'uno', { sel: UI.selected.has(card.id), cardObj: card });
      el.onclick = () => {
        if(UI.selected.has(card.id)) UI.selected.delete(card.id);
        else { UI.selected.clear(); UI.selected.add(card.id); }
        renderGame(view, mySeat, fullS, UI.deadline);
      };
      H.appendChild(el);
    });
  } else {
    (view.hand || []).forEach(id => {
      const el = cardEl(id, gid, { sel: UI.selected.has(id) });
      el.onclick = () => {
        if(UI.selected.has(id)) UI.selected.delete(id); else UI.selected.add(id);
        renderGame(view, mySeat, fullS, UI.deadline);
      };
      H.appendChild(el);
    });
  }

  const myTurnHere = (()=>{
    if(NET.isHost){
      if(!HOST.running || !HOST.S) return false;
      return HOST.mod.myTurn(HOST.S, 0);
    }
    if(gid === 'ddz') return view.phase==='bid' ? view.turn===mySeat : (view.phase==='play' && view.turn===mySeat);
    if(gid === 'tarot') return view.phase==='bid' ? view.turn===mySeat : (view.phase==='discard' ? view.taker===mySeat : (view.phase==='play' && view.turn===mySeat));
    if(gid === 'mj') return view.phase==='que' ? (view.que && view.que[mySeat] === -1) : (view.phase==='claim' ? (view.pending && view.pending.from !== mySeat) : (view.phase==='play' && view.turn===mySeat));
    if(gid === 'hearts') return view.phase==='play' && view.turn===mySeat;
    if(gid === 'uno') return view.phase==='play' && view.turn===mySeat;
    return view.turn === mySeat;
  })();

  const isChallenge = gid === 'uno' && view.lastPlayWasWild4;
  const canPass = myTurnHere && view.lead && gid !== 'uno' && gid !== 'hearts' && gid !== 'tarot' && gid !== 'mj';

  $('#btnPass').style.display = canPass ? '' : 'none';
  $('#btnPlay').style.display = (myTurnHere || (isChallenge && mySeat === view.turn)) ? '' : 'none';
  $('#btnHint').style.display = myTurnHere ? '' : 'none';

  if(isChallenge && mySeat === view.turn){
    $('#btnPlay').style.display = 'none';
    $('#btnHint').style.display = 'none';
  }

  const A = $('#actions');
  A.innerHTML = '';

  if(isChallenge && mySeat === view.turn){
    const b1 = document.createElement('button');
    b1.textContent = '接受 +4（摸 4 张）';
    b1.onclick = () => doAction({ a:'accept' });
    A.appendChild(b1);
    const b2 = document.createElement('button');
    b2.className = 'red';
    b2.textContent = '挑战 +4';
    b2.onclick = () => doAction({ a:'challenge' });
    A.appendChild(b2);
  }

  if(gid === 'uno' && !myTurnHere && view.phase === 'play'){
    const top = view.top;
    const jumpable = (view.hand||[]).filter(c => {
      if(c.t === 'wild' || c.t === 'wild4') return false;
      if(c.c !== top.c) return false;
      if(c.t === 'num') return top.t === 'num' && c.v === top.v;
      return c.t === top.t;
    });
    if(jumpable.length){
      const b = document.createElement('button');
      b.className = 'gold';
      b.textContent = '⚡ 抢零';
      b.onclick = () => doAction({ a:'jumpin', id: jumpable[0].id });
      A.appendChild(b);
    }
  }

  if(gid === 'mj' && view.phase === 'que' && view.que && view.que[mySeat] === -1){
    ['万','条','筒'].forEach((s, i) => {
      const b = document.createElement('button');
      b.textContent = '定缺：' + s;
      b.onclick = () => doAction({ a:'que', s:i });
      A.appendChild(b);
    });
  }

  if(gid === 'tarot' && view.phase === 'bid' && view.turn === mySeat){
    for(let c = view.contract+1; c < 4; c++){
      const b = document.createElement('button');
      b.textContent = '叫：' + CONTRACTS_TAROT[c].name;
      b.onclick = () => doAction({ a:'bid', c });
      A.appendChild(b);
    }
  }

  const timerEl = $('#timerBadge');
  const showTimer = myTurnHere && UI.deadline;
  if(showTimer){
    const remain = Math.max(0, Math.ceil((UI.deadline - Date.now())/1000));
    timerEl.textContent = `⏱ ${remain}s`;
    timerEl.style.display = 'block';
    timerEl.classList.toggle('warn', remain <= 10);
  } else timerEl.style.display = 'none';
  if(UI.timerHandle) clearInterval(UI.timerHandle);
  if(showTimer){
    UI.timerHandle = setInterval(() => {
      const r = Math.max(0, Math.ceil((UI.deadline - Date.now())/1000));
      const el = $('#timerBadge');
      if(el){ el.textContent = `⏱ ${r}s`; el.classList.toggle('warn', r<=10); }
      if(r<=0){ clearInterval(UI.timerHandle); UI.timerHandle = null; }
    }, 500);
  }

  if(NET.isHost) $('#netStatus').textContent = '房主 · 权威主机';

  const old = document.querySelector('.pop');
  if(old) old.remove();
  if(view.over){
    const ov = document.createElement('div');
    ov.className = 'pop';
    let txt = '';
    if(gid === 'ddz'){
      const w = view.over.winner;
      txt = `地主${w === view.landlord ? '胜' : '负'}<br>倍数 ×${view.over.mult}`;
    } else if(gid === 'mj'){
      txt = '本局结束<br>' + (view.huInfo||[]).map(h => `${names[h.seat]} 胡 ${h.fan}番<br><span style="font-size:11px;color:#8b949e">${(h.tags||[]).join(' ')}</span>`).join('<br>');
    } else if(gid === 'tarot'){
      const o = view.over;
      txt = `庄家：${names[o.taker]}<br>${CONTRACTS_TAROT[o.contract].name}<br>得分：${o.takerPoints.toFixed(1)} / 需要 ${o.need}<br>${o.diff>=0?'庄家胜':'闲家胜'} · 分数 ${o.score}`;
    } else if(gid === 'hearts'){
      txt = '本局结束<br>总分：' + view.over.scores.map((s,i)=>`${names[i]} ${s}`).join('<br>');
    } else {
      txt = '本局结束<br>' + (view.over.winners||[]).map(i=>names[i]).join(', ') + ' 胜';
    }
    ov.innerHTML = txt + '<br><br>';
    const b = document.createElement('button');
    b.textContent = '返回房间';
    b.onclick = () => { ov.remove(); go('scr-room'); };
    ov.appendChild(b);
    $('#scr-game').appendChild(ov);
  }
}

/* =====================================================================
   14. 动作
   ===================================================================== */
function doAction(act){
  if(NET.isHost){
    if(!HOST.running || !HOST.S) return;
    const ok = HOST.mod.legal(HOST.S, 0).some(a => JSON.stringify(a) === JSON.stringify(act));
    if(!ok){ log('非法动作', '#log2'); return; }
    UI.selected.clear();
    HOST.mod.apply(HOST.S, 0, act);
    hostBroadcastViews();
    setTimeout(hostStepAI, 100);
  } else {
    UI.selected.clear();
    NET.toHost({ t:'action', a:act });
  }
}

$('#btnPlay').onclick = () => {
  const v = UI.view;
  if(!v) return;
  const gid = v.gid;

  if(gid === 'ddz' && v.phase === 'bid'){ doAction({a:'bid'}); return; }
  if(gid === 'tarot' && v.phase === 'bid'){
    const next = v.contract + 1;
    if(next < 4) doAction({a:'bid', c:next});
    return;
  }
  if(gid === 'hearts' || gid === 'tarot'){
    if(UI.selected.size === 0) return log('请选择一张牌', '#log2');
    const id = [...UI.selected][0];
    if(gid === 'tarot' && v.phase === 'discard') doAction({a:'discard', id});
    else doAction({a:'play', id});
    return;
  }
  if(gid === 'uno'){
    if(UI.selected.size === 0){ doAction({a:'draw'}); return; }
    const cardId = [...UI.selected][0];
    const card = (v.hand||[]).find(c => c.id===cardId);
    if(card && (card.t==='wild' || card.t==='wild4')){
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = `<div class="box"><div style="margin-bottom:10px">选择颜色</div>
        <div style="display:flex;gap:10px;justify-content:center">
          <div class="colorbtn" style="background:#e74c3c" data-c="0"></div>
          <div class="colorbtn" style="background:#f1c40f" data-c="1"></div>
          <div class="colorbtn" style="background:#27ae60" data-c="2"></div>
          <div class="colorbtn" style="background:#3498db" data-c="3"></div>
        </div></div>`;
      bg.querySelectorAll('.colorbtn').forEach(b => {
        b.onclick = () => {
          const color = +b.dataset.c;
          bg.remove();
          doAction({ a:'play', id:cardId, color });
        };
      });
      document.body.appendChild(bg);
      return;
    }
    doAction({ a:'play', id:cardId });
    return;
  }
  if(gid === 'mj'){
    if(UI.selected.size === 0) return log('请选择要出的牌', '#log2');
    const tile = [...UI.selected][0];
    doAction({ a:'discard', tile });
    return;
  }
  if(UI.selected.size === 0) return log('请选择要出的牌', '#log2');
  doAction({ a:'play', ids:[...UI.selected] });
};

$('#btnPass').onclick = () => {
  const v = UI.view;
  if(!v) return;
  if(v.gid === 'tarot' && v.phase === 'bid') return doAction({a:'pass'});
  doAction({ a:'pass' });
};

$('#btnHint').onclick = () => {
  const v = UI.view;
  if(!v) return;
  if(NET.isHost){
    if(!HOST.running || !HOST.S) return;
    const L = HOST.mod.legal(HOST.S, 0);
    const plays = L.filter(a => a.a==='play' || a.a==='discard' || a.a==='draw');
    if(!plays.length) return log('无可提示的动作', '#log2');
    const pick = plays[Math.floor(Math.random() * Math.min(plays.length, 8))];
    UI.selected.clear();
    if(pick.ids) pick.ids.forEach(id => UI.selected.add(id));
    else if(pick.id != null) UI.selected.add(pick.id);
    else if(pick.tile != null) UI.selected.add(pick.tile);
    renderGame(v, 0, HOST.S, UI.deadline);
  } else {
    NET.toHost({ t:'hint' });
  }
};

function showRules(gid){
  const r = RULES[gid]; if(!r) return;
  $('#rulesTitle').textContent = `📖 ${r.name} · ${r.players}`;
  const li = a => a.map(x => `<li>${x}</li>`).join('');
  $('#rulesBody').innerHTML = `
    <h4>🎯 目标</h4><div>${r.goal}</div>
    <h4>📜 基础规则</h4><ul>${li(r.basic)}</ul>
    <h4>🃏 牌型 / 计分</h4><ul>${li(r.types)}</ul>
    <h4>💡 提示</h4>${r.tips.map(t => `<div class="tip">${t}</div>`).join('')}
  `;
  $('#rulesModal').style.display = 'flex';
}
$('#rulesClose').onclick = () => $('#rulesModal').style.display = 'none';
$('#rulesModal').onclick = e => { if(e.target.id==='rulesModal') $('#rulesModal').style.display = 'none'; };
$('#btnRules').onclick = () => {
  const gid = (UI.view && UI.view.gid) || $('#gid').value;
  showRules(gid);
};

/* =====================================================================
   16. 启动
   ===================================================================== */
function randomRid(){
  const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
  let s = '';
  for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
$('#btnRandomRid').onclick = () => { $('#rid').value = randomRid(); };

$('#btnCreate').onclick = async () => {
  const gid = $('#gid').value;
  const ridRaw = $('#rid').value.trim();
  if(!validRoomId(ridRaw)) return log('❌ 房间号必须是 4-8 位字母或数字', '#log');
  const normRid = normalizeRoomId(ridRaw);
  const nick = ($('#nick').value || '房主').slice(0, 10);
  HOST.gid = gid;
  HOST.seats = [{ name:nick, conn:null, ready:true, connected:true, ai:false }];
  try{
    log('⏳ 正在创建房间「' + normRid + '」…', '#log');
    await NET.createRoom(normRid);
    log('✅ 房间已创建：' + normRid, '#log');
    log('💡 把房间号「' + normRid + '」告诉好友，让他们用「加入房间」加入', '#log');
    go('scr-room');
    $('#roomCodeDisplay').value = normRid;
    $('#roomHint').textContent = `把房间号「${normRid}」告诉好友，让他们输入加入`;
    $('#connBadge').textContent = '已连接';
    $('#connBadge').className = '';
    log('👑 你是房主。点「开始游戏」开始，或点「加 AI」补足人数。', '#log2');
    hostBroadcastRoom();
  }catch(e){
    NET.isHost = false; NET.roomId = '';
    log('❌ 创建失败：' + (e.message || e), '#log');
    log('   请换一个房间号试试', '#log');
  }
};

$('#btnJoin').onclick = async () => {
  const ridRaw = $('#rid').value.trim();
  if(!validRoomId(ridRaw)) return log('❌ 房间号必须是 4-8 位字母或数字', '#log');
  const normRid = normalizeRoomId(ridRaw);
  const nick = ($('#nick').value || '玩家').slice(0, 10);
  log('⏳ 正在连接房间「' + normRid + '」…', '#log');
  try{
    await NET.joinRoom(normRid);
    log('📡 已连接，等待房主确认…', '#log');
    NET.toHost({ t:'join', name:nick });
    go('scr-room');
    $('#roomCodeDisplay').value = normRid;
    $('#roomHint').textContent = `等待房主开始游戏（房间号：${normRid}）`;
    $('#connBadge').textContent = '等待确认';
    $('#connBadge').className = 'wait';
    CLIENT.welcomeReceived = false;
    CLIENT.welcomeTimer = setTimeout(() => {
      if(!CLIENT.welcomeReceived){
        log('❌ 加入超时：房主未响应', '#log');
        log('   可能原因：房间号错误 / 房主已离开 / 网络问题', '#log');
        try{ NET.hostConn && NET.hostConn.close(); }catch(e){}
        NET.hostConn = null;
        go('scr-menu');
      }
    }, 8000);
  }catch(e){
    log('❌ 加入失败：' + (e.message || e), '#log');
    log('   请检查房间号是否正确、房主是否已创建房间', '#log');
  }
};

$('#btnSolo').onclick = () => {
  const gid = $('#gid').value;
  const mod = GAMES[gid];
  HOST.gid = gid;
  HOST.seats = [];
  for(let i=0;i<mod.minP;i++) HOST.seats.push({
    name: i===0 ? '我' : 'AI-'+i,
    conn:null, ready:true, connected:true, ai: i!==0
  });
  NET.isHost = true; CLIENT.seat = 0;
  HOST.mod = mod; HOST.running = false;
  hostStartGame();
  go('scr-game');
};

$('#btnAddAI').onclick = () => {
  const mod = GAMES[HOST.gid || $('#gid').value];
  if(!NET.isHost) return;
  if(HOST.seats.length >= mod.maxP) return log('房间已满', '#log2');
  const i = HOST.seats.length;
  HOST.seats.push({ name:'AI-'+i, conn:null, ready:true, connected:true, ai:true });
  log('🤖 已添加 AI-' + i, '#log2');
  hostBroadcastRoom();
};

$('#btnReady').onclick = () => {
  if(NET.isHost){
    const mod = GAMES[HOST.gid];
    if(HOST.seats.length < mod.minP) return log('⚠ 人数不足，至少需要 ' + mod.minP + ' 人', '#log2');
    if(!HOST.seats.every(s => s.ready || s.ai || s.connected === false)) return log('⚠ 还有玩家未准备', '#log2');
    hostStartGame();
  } else {
    NET.toHost({ t:'ready', v:true });
    $('#btnReady').disabled = true;
    $('#btnReady').textContent = '✓ 已准备';
  }
};

$('#btnLeave').onclick = $('#btnLeave2').onclick = () => {
  if(NET.hostConn){
    try{ NET.toHost({ t:'leave' }); }catch(e){}
  }
  setTimeout(() => location.reload(), 200);
};

$('#btnCopyRoom').onclick = () => {
  const rid = NET.roomId || $('#roomCodeDisplay').value;
  if(!rid || rid === '————') return;
  const text = `来玩 P2P 牌桌！房间号：${rid}`;
  const done = () => {
    const b = $('#btnCopyRoom');
    const old = b.textContent;
    b.textContent = '✅ 已复制';
    setTimeout(() => b.textContent = old, 1500);
  };
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(() => {
      log('📋 已复制房间号到剪贴板', '#log2');
      done();
    }).catch(() => { fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
};
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); log('📋 已复制', '#log2'); } catch(e){ log('复制失败，请手动复制', '#log2'); }
  ta.remove();
}

log('💡 玩法：', '#log');
log('  1) 输入昵称 + 4-8 位房间号，点「创建房间」', '#log');
log('  2) 把房间号告诉好友，让他们输入同一房间号点「加入房间」', '#log');
log('  3) 房主点「开始游戏」或「加 AI」补足人数', '#log');
log('  4) 每回合 30 秒限时，超时自动过/摸', '#log');
