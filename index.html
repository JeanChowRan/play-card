GAMES.tarot = (() => {
  const isTrump = id => id < 22;
  const isExcuse = id => id === 21;
  const isOudler = id => id===0 || id===20 || id===21;
  const suitOf = id => id<22 ? -1 : Math.floor((id-22)/14);
  const rankOf = id => id<22 ? -1 : (id-22)%14;
  function cardPoints(id){
    if(id===21) return 4.5;
    if(id===0 || id===20) return 4.5;
    if(id<22) return 0.5;
    const r = rankOf(id);
    if(r===13) return 4.5;
    if(r===12) return 3.5;
    if(r===11) return 2.5;
    if(r===10) return 1.5;
    return 0.5;
  }
  const NEED4 = [56, 51, 41, 36];
  function compareCard(a, b, leadSuit){
    const aT = isTrump(a) && !isExcuse(a);
    const bT = isTrump(b) && !isExcuse(b);
    if(isExcuse(a)) return -1;
    if(isExcuse(b)) return 1;
    if(aT && !bT) return 1;
    if(bT && !aT) return -1;
    if(aT && bT) return a > b ? 1 : (a < b ? -1 : 0);
    const aLead = suitOf(a) === leadSuit;
    const bLead = suitOf(b) === leadSuit;
    if(aLead && !bLead) return 1;
    if(bLead && !aLead) return -1;
    if(suitOf(a) !== suitOf(b)) return 0;
    return rankOf(a) > rankOf(b) ? 1 : (rankOf(a) < rankOf(b) ? -1 : 0);
  }
  function trickWinner(trick, leadSuit){
    let best = 0;
    for(let i=1;i<trick.length;i++){
      if(compareCard(trick[i].id, trick[best].id, leadSuit) > 0) best = i;
    }
    return trick[best].seat;
  }
  return {
    id:'tarot', name:'法式塔罗牌', minP:4, maxP:4, teams:false,
    _key: id => id,
    init(S, seed, n){
      const rng = mulberry32(seed);
      const deck = shuffle([...Array(78).keys()], rng);
      S.hands = [[],[],[],[]];
      for(let i=0;i<72;i++) S.hands[i%4].push(deck[i]);
      S.dog = deck.slice(72);
      S.hands.forEach(h => h.sort((a,b) => {
        if(isTrump(a) && !isTrump(b)) return 1;
        if(isTrump(b) && !isTrump(a)) return -1;
        if(isTrump(a) && isTrump(b)) return a - b;
        return suitOf(a)-suitOf(b) || rankOf(a)-rankOf(b);
      }));
      S.phase = 'bid';
      S.bidSeat = Math.floor(rng()*4);
      S.turn = S.bidSeat;
      S.contract = -1; S.taker = -1;
      S.trick = []; S.trickLeadSuit = -1; S.tricksPlayed = 0;
      S.takerPoints = 0;
      S.takerCards = []; S.defCards = [];
      S.over = null; S.n = 4;
      S.seatNames = S.seatNames || ['我','下家','对家','上家'];
    },
    view(S, seat){
      return {
        gid:'tarot', seat, phase:S.phase, turn:S.turn,
        hand:(S.hands[seat]||[]).slice(), counts:S.hands.map(h=>h.length),
        dog: S.phase==='play' ? S.dog.slice() : null,
        contract:S.contract, taker:S.taker, bidSeat:S.bidSeat,
        trick:S.trick.slice(), trickLeadSuit:S.trickLeadSuit,
        takerPoints:S.takerPoints, takerCards:S.takerCards.slice(),
        defCards:S.defCards.slice(), over:S.over, names:S.seatNames,
      };
    },
    myTurn(S, seat){
      if(S.over) return false;
      if(S.phase==='bid') return S.turn===seat;
      if(S.phase==='discard') return seat===S.taker;
      return S.phase==='play' && S.turn===seat;
    },
    legal(S, seat){
      if(S.over) return [];
      if(S.phase==='bid'){
        if(S.turn!==seat) return [];
        const out = [{a:'pass'}];
        for(let c=S.contract+1;c<4;c++) out.push({a:'bid', c});
        return out;
      }
      if(S.phase==='discard'){
        if(seat!==S.taker) return [];
        return S.hands[seat].map(id => ({a:'discard', id}));
      }
      if(S.phase==='play' && S.turn===seat){
        const hand = S.hands[seat];
        const out = [];
        const isLead = S.trick.length===0;
        if(isLead){ hand.forEach(id => out.push({a:'play', id})); return out; }
        const hasLead = hand.some(id => suitOf(id)===S.trickLeadSuit);
        if(hasLead){
          hand.filter(id => suitOf(id)===S.trickLeadSuit || isExcuse(id)).forEach(id => out.push({a:'play', id}));
          return out;
        }
        const trumps = hand.filter(id => isTrump(id) && !isExcuse(id));
        if(trumps.length){
          hand.filter(id => (isTrump(id) && !isExcuse(id)) || isExcuse(id)).forEach(id => out.push({a:'play', id}));
          return out;
        }
        hand.forEach(id => out.push({a:'play', id}));
        return out;
      }
      return [];
    },
    apply(S, seat, act){
      if(act.a==='pass'){
        S.turn = (S.turn+1)%4;
        if(S.turn === S.taker || (S.taker>=0 && S.turn === (S.taker+1)%4)) this._finalizeBid(S);
        return;
      }
      if(act.a==='bid'){
        S.contract = act.c; S.taker = seat;
        S.bidSeat = (seat+1)%4; S.turn = S.bidSeat;
        if(S.turn === S.taker) this._finalizeBid(S);
        return;
      }
      if(act.a==='discard'){
        const idx = S.hands[seat].indexOf(act.id);
        if(idx>=0){ S.hands[seat].splice(idx, 1); S.dog.push(act.id); }
        if(S.dog.length >= 12){ S.phase='play'; S.turn = S.taker; S.trick = []; S.trickLeadSuit = -1; }
        return;
      }
      if(act.a==='play'){
        const idx = S.hands[seat].indexOf(act.id);
        if(idx<0) return;
        const id = S.hands[seat].splice(idx, 1)[0];
        if(S.trick.length===0) S.trickLeadSuit = suitOf(id);
        S.trick.push({ seat, id });
        if(S.trick.length===4){
          const winner = trickWinner(S.trick, S.trickLeadSuit);
          let pts = 0;
          S.trick.forEach(t => pts += cardPoints(t.id));
          if(winner===S.taker){ S.takerPoints += pts; S.trick.forEach(t => S.takerCards.push(t.id)); }
          else S.trick.forEach(t => S.defCards.push(t.id));
          S.trick = []; S.trickLeadSuit = -1;
          S.turn = winner; S.tricksPlayed++;
          if(S.hands.every(h => h.length===0)) this._finalize(S);
        } else S.turn = (seat+1)%4;
        return;
      }
    },
    _finalizeBid(S){
      S.hands[S.taker] = S.hands[S.taker].concat(S.dog).sort((a,b) => {
        if(isTrump(a) && !isTrump(b)) return 1;
        if(isTrump(b) && !isTrump(a)) return -1;
        if(isTrump(a) && isTrump(b)) return a - b;
        return suitOf(a)-suitOf(b) || rankOf(a)-rankOf(b);
      });
      S.dog = []; S.phase = 'discard'; S.turn = S.taker;
    },
    _finalize(S){
      const takerPts = S.takerPoints;
      let oudlers = 0;
      S.takerCards.forEach(id => { if(isOudler(id)) oudlers++; });
      const need = NEED4[Math.min(oudlers,3)];
      const contractMult = CONTRACTS_TAROT[S.contract].mult;
      const diff = takerPts - need;
      const base = Math.round(Math.abs(diff)) + 25;
      const score = base * contractMult;
      if(diff >= 0) S.over = { done:true, taker:S.taker, contract:S.contract, takerPoints:takerPts, need, diff, score, winner:S.taker };
      else S.over = { done:true, taker:S.taker, contract:S.contract, takerPoints:takerPts, need, diff, score:-score, winner:-1 };
    },
    ai(S, seat){
      if(S.phase==='bid'){
        const h = S.hands[seat];
        let sc = 0, trumps = 0, oudlers = 0;
        h.forEach(id => { if(isTrump(id) && !isExcuse(id)) trumps++; if(isOudler(id)) oudlers++; });
        sc += trumps * 2 + oudlers * 5;
        h.forEach(id => { if(!isTrump(id) && rankOf(id)>=12) sc += 2; });
        if(h.includes(20)) sc += 5;
        if(h.includes(21)) sc += 3;
        const want = sc >= 30 ? 3 : sc >= 24 ? 2 : sc >= 18 ? 1 : -1;
        const L = this.legal(S, seat);
        for(const a of L){ if(a.a==='bid' && a.c <= want){ if(a.c === want) return a; } }
        return {a:'pass'};
      }
      if(S.phase==='discard'){
        const h = S.hands[seat].slice();
        const rank = id => {
          let v = 0;
          if(isTrump(id)) v += 30 + (id===20?10:0) + (id===21?5:0);
          if(isOudler(id)) v += 20;
          if(!isTrump(id)) v += rankOf(id);
          return v;
        };
        h.sort((a,b) => rank(a) - rank(b));
        return {a:'discard', id:h[0]};
      }
      if(S.phase==='play'){
        const L = this.legal(S, seat);
        if(!L.length) return null;
        if(S.trick.length===0){
          const sorted = L.slice().sort((a,b) => {
            const ra = isTrump(a.id) ? 30 + a.id : (isExcuse(a.id) ? 25 : rankOf(a.id));
            const rb = isTrump(b.id) ? 30 + b.id : (isExcuse(b.id) ? 25 : rankOf(b.id));
            return rb - ra;
          });
          const big = sorted.find(a => a.id===20 || a.id===21);
          if(big) return big;
          return sorted[0];
        }
        let best = null, bs = -1e9;
        for(const a of L){
          let s = 0;
          if(isExcuse(a.id)) s = -100;
          else if(isTrump(a.id)) s = 30 + a.id;
          else s = suitOf(a.id)===S.trickLeadSuit ? rankOf(a.id) : -20;
          if(s > bs){ bs = s; best = a; }
        }
        return best || L[0];
      }
      return null;
    },
    over(S){ return S.over; },
  };
})();

function buildCardSVG(id, gid, tiny){
  if(gid === 'tarot'){
    const isT = id < 22 && id !== 21;
    const isE = id === 21;
    const color = isT || isE ? '#a37b00' : (Math.floor((id-22)/14)===1 ? '#d1242f' : '#111');
    const bg = isT || isE ? 'url(#tg)' : '#fff';
    const suit = id<22 ? '' : P_SUITS[Math.floor((id-22)/14)];
    const big = id===21 ? '🌙' : (id<22 ? id+1 : (P_NAMES_TAROT[(id-22)%14]));
    return `<svg viewBox="0 0 60 84" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a3"/><stop offset="1" stop-color="#d8b04a"/></linearGradient></defs><rect x="1" y="1" width="58" height="82" rx="6" fill="${bg}" stroke="#8b949e"/><text x="30" y="${tiny?40:44}" font-size="${tiny?18:24}" font-weight="800" text-anchor="middle" fill="${color}" font-family="serif">${big}</text><text x="30" y="${tiny?56:70}" font-size="${tiny?8:11}" text-anchor="middle" fill="${color}" font-family="serif">${suit}</text></svg>`;
  }
  if(gid === 'uno') return '';
  if(gid === 'mj'){
    const s = Math.floor(id / 9), n = (id % 9) + 1;
    const color = s===1 ? '#0969da' : (s===2 ? '#1a7f37' : '#d1242f');
    const big = ['万','条','筒'][s];
    return `<svg viewBox="0 0 60 84" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="58" height="82" rx="7" fill="#fbf7e4" stroke="#8b949e"/><rect x="4" y="4" width="52" height="76" rx="5" fill="none" stroke="#d4c8a8" stroke-dasharray="2,2"/><text x="30" y="${tiny?40:46}" font-size="${tiny?22:28}" font-weight="800" text-anchor="middle" fill="${color}" font-family="serif">${big}</text><text x="30" y="${tiny?54:66}" font-size="${tiny?9:12}" text-anchor="middle" fill="${color}">${n}</text></svg>`;
  }
  const isPDK = gid === 'pdk';
  const isGD = gid === 'gd';
  let rank, suit, red;
  if(isGD){
    const b = id % 54;
    if(b >= 52){ rank = b===52?'小':'大'; suit='JOKER'; red = (b===53); }
    else { rank = RANKS[b%13]; suit = SUITS[Math.floor(b/13)]; red = Math.floor(b/13)===1 || Math.floor(b/13)===3; }
  } else if(isPDK){
    rank = RANKS_PDK[(id % 13) - 1] || RANKS_PDK[0];
    suit = SUITS[Math.floor(id/13)];
    red = Math.floor(id/13)===1 || Math.floor(id/13)===3;
  } else {
    if(id >= 52){ rank = id===52?'小':'大'; suit='JOKER'; red = (id===53); }
    else { rank = RANKS[id%13]; suit = SUITS[Math.floor(id/13)]; red = Math.floor(id/13)===1 || Math.floor(id/13)===3; }
  }
  const color = red ? '#d1242f' : '#111';
  if(suit === 'JOKER'){
    return `<svg viewBox="0 0 60 84" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="58" height="82" rx="7" fill="#fff" stroke="#8b949e"/><text x="30" y="30" font-size="16" text-anchor="middle" fill="${color}" font-family="serif">JOKER</text><text x="30" y="58" font-size="30" text-anchor="middle" fill="${color}">★</text><text x="30" y="76" font-size="12" text-anchor="middle" fill="${color}">${rank}</text></svg>`;
  }
  const fs = tiny ? 11 : 15;
  const midFs = tiny ? 22 : 30;
  return `<svg viewBox="0 0 60 84" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="58" height="82" rx="7" fill="#fff" stroke="#8b949e"/><text x="6" y="${tiny?16:19}" font-size="${fs}" font-weight="800" fill="${color}" font-family="serif">${rank}</text><text x="6" y="${tiny?28:34}" font-size="${tiny?11:14}" fill="${color}" font-family="serif">${suit}</text><text x="30" y="${tiny?44:54}" font-size="${midFs}" text-anchor="middle" fill="${color}" font-family="serif">${suit}</text><text x="54" y="${tiny?74:80}" font-size="${fs}" font-weight="800" fill="${color}" text-anchor="end" font-family="serif" transform="rotate(180 54 ${tiny?74:80})">${rank}</text><text x="54" y="${tiny?62:66}" font-size="${tiny?11:14}" fill="${color}" text-anchor="end" font-family="serif" transform="rotate(180 54 ${tiny?62:66})">${suit}</text></svg>`;
}
function unoLabel(card){
  if(!card) return '?';
  if(card.t==='num') return String(card.v);
  if(card.t==='skip') return '⊘';
  if(card.t==='rev') return '⇄';
  if(card.t==='draw2') return '+2';
  if(card.t==='wild') return '★';
  if(card.t==='wild4') return '+4';
  return '?';
}
function buildUnoSVG(card, tiny){
  const col = card.c >= 0 ? UNO_COLORS[card.c] : '#7d8590';
  const label = unoLabel(card);
  const fs = tiny ? 16 : 22;
  return `<svg viewBox="0 0 60 84" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="58" height="82" rx="8" fill="${col}" stroke="#fff" stroke-width="2"/><ellipse cx="30" cy="42" rx="23" ry="32" fill="#fff" opacity="0.92" transform="rotate(-20 30 42)"/><text x="30" y="${tiny?48:52}" font-size="${fs}" font-weight="800" text-anchor="middle" fill="${col}" font-family="sans-serif">${label}</text></svg>`;
}
function cardEl(id, gid, opts = {}){
  const { sel, tiny, disabled, cardObj } = opts;
  const el = document.createElement('div');
  el.className = 'pcard' + (sel?' sel':'') + (tiny?' tiny':'') + (disabled?' dis':'');
  if(gid === 'uno' && cardObj) el.innerHTML = buildUnoSVG(cardObj, tiny);
  else el.innerHTML = buildCardSVG(id, gid, tiny);
  return el;
}

/* ★ 玩家列表渲染（带防御 + 日志） */
function renderSeatList(seats, mySeat, gid, maxP, minP){
  try{
    const box = $('#seatList');
    if(!box){ console.error('seatList not found'); return; }
    if(!Array.isArray(seats)) seats = [];
    const _game = GAMES[gid] || {};
    maxP = maxP || _game.maxP || 4;
    minP = minP || _game.minP || 2;
    console.log('[renderSeatList]', {gid, mySeat, seats: seats.length, maxP, minP});

    if(NET.roomId){
      $('#roomCodeDisplay').value = NET.roomId;
      $('#roomHint').textContent = `把房间号「${NET.roomId}」告诉好友，让他们输入加入`;
    }
    const sorted = seats.slice().sort((a,b)=>a.seat-b.seat);
    box.innerHTML = '';
    let playerCount = 0;
    sorted.forEach(s => {
      const isMe = s.seat === mySeat;
      const d = document.createElement('div');
      d.className = 'seat' + (isMe?' me':'');
      if(s.connected === false){
        d.classList.add('empty');
        d.innerHTML = `<div class="ico">✕</div><div style="flex:1"><div class="nm" style="color:#8b949e">${s.name}</div><div class="sub">已断开</div></div><div class="badge off">离线</div>`;
      } else {
        playerCount++;
        const initial = (s.name||'?').charAt(0).toUpperCase();
        let badge = '';
        if(s.ai) badge = '<span class="badge ai">🤖 AI</span>';
        else if(s.ready) badge = '<span class="badge ready">✓ 已准备</span>';
        else badge = '<span class="badge wait">等待准备</span>';
        const hostBadge = s.isHost ? '<span class="badge host">👑 房主</span>' : '';
        d.innerHTML = `<div class="ico">${s.ai ? '🤖' : initial}</div><div style="flex:1;min-width:0"><div class="nm">${s.name}${isMe?' <span style="font-size:11px;color:#58a6ff">(你)</span>':''}</div><div class="sub">座位 ${s.seat+1}</div></div>${hostBadge}${badge}`;
      }
      box.appendChild(d);
    });
    for(let i = sorted.length; i < maxP; i++){
      const d = document.createElement('div');
      d.className = 'seat empty';
      d.innerHTML = `<div class="ico">+</div><div style="flex:1"><div class="nm" style="color:#484f58">等待加入…</div><div class="sub">把房间号分享给好友</div></div><div class="badge wait">空位</div>`;
      box.appendChild(d);
    }
    $('#roomPlayersCount').textContent = `(${playerCount}/${maxP})`;
    if(mySeat === 0){
      $('#btnReady').textContent = '开始游戏';
      $('#btnReady').disabled = (playerCount < minP) || !sorted.every(s => s.ready || s.ai || s.connected === false);
    } else {
      $('#btnReady').textContent = '准备';
    }
  }catch(e){
    console.error('[renderSeatList] error:', e);
    try{ log('❌ 渲染玩家列表失败: ' + (e && e.message), '#log2'); }catch(_){}
  }
}

    const d = document.createElement('div');
    d.style.cssText = 'text-align:center';
    d.innerHTML = `<div style="display:inline-block;background:${colHex};border-radius:10px;padding:8px 16px;font-size:20px;font-weight:800;color:#fff;min-width:60px;box-shadow:0 4px 12px #0008">${unoLabel(top)}</div>`;
    C.appendChild(d);
    CI.innerHTML = `当前颜色：${view.currentColor>=0?UNO_CNAME[view.currentColor]:'—'} · 牌堆 ${view.deckCount} · ${view.dir>0?'↻':'↺'}<br>${view.counts.map((c,i)=>`${names[i]} ${c}`).join(' · ')}`;
    if(view.lastPlayWasWild4){ CI.innerHTML += `<br><span style="color:#da3633">⚠ ${names[view.lastWild4By]} 出了 +4，请选择接受或挑战！</span>`; }
  } else if(gid === 'tarot'){
    if(view.trick.length){
      const d = document.createElement('div');
      d.style.textAlign = 'center';
      d.innerHTML = `<div style="font-size:11px;color:#8b949e">本墩 ${view.trick.length}/4</div>`;
      const row = document.createElement('div');
      row.className = 'card-list';
      row.style.justifyContent = 'center';
      view.trick.forEach(t => {
        const wrap = document.createElement('div');
        wrap.style.cssText = 'text-align:center;margin:0 3px';
        wrap.appendChild(cardEl(t.id,'tarot',{}));
        const lb = document.createElement('div');
        lb.style.cssText = 'font-size:10px;color:#8b949e';
        lb.textContent = names[t.seat];
        wrap.appendChild(lb);
        row.appendChild(wrap);
      });
      d.appendChild(row);
      C.appendChild(d);
    } else CI.textContent = view.phase==='bid' ? '叫牌中…' : (view.phase==='discard' ? '庄家换底…' : '等待领出…');
    if(view.taker >= 0) CI.innerHTML += `<br>庄家：${names[view.taker]} · ${CONTRACTS_TAROT[view.contract].name} · 已得 ${view.takerPoints.toFixed(1)} 分`;
  } else {
    if(view.phase === 'bid') CI.textContent = '叫地主中…';
    else if(view.lastPlay){
      const d = document.createElement('div');
      d.style.textAlign = 'center';
      d.innerHTML = `<div style="font-size:11px;color:#8b949e">${names[view.lastPlay.seat]} 出牌</div>`;
      const row = document.createElement('div');
      row.className = 'card-list';
      row.style.justifyContent = 'center';
      view.lastPlay.ids.forEach(id => row.appendChild(cardEl(id, gid, {tiny:true})));
      d.appendChild(row);
      C.appendChild(d);
    } else CI.textContent = '等待出牌…';
    if(gid === 'gd') CI.innerHTML += `<br>级牌：${view.level}`;
    if(gid === 'pdk' && view.mustSpade3) CI.innerHTML += `<br><span style="color:#f0b429">首出必须包含 ♠3</span>`;
    if(gid === 'qw') CI.innerHTML += `<br>牌堆剩余：${view.deckCount} 张`;
  }
  const H = $('#handWrap');
  H.innerHTML = '';
  if(gid === 'uno'){
    (view.hand || []).forEach(card => {
      const el = cardEl(card.id,'uno',{sel:UI.selected.has(card.id), cardObj:card});
      el.onclick = () => {
        if(UI.selected.has(card.id)) UI.selected.delete(card.id);
        else { UI.selected.clear(); UI.selected.add(card.id); }
        renderGame(view, mySeat, fullS, UI.deadline);
      };
      H.appendChild(el);
    });
  } else {
    (view.hand || []).forEach(id => {
      const el = cardEl(id, gid, {sel:UI.selected.has(id)});
      el.onclick = () => {
        if(UI.selected.has(id)) UI.selected.delete(id);
        else UI.selected.add(id);
        renderGame(view, mySeat, fullS, UI.deadline);
      };
      H.appendChild(el);
    });
  }
  const myTurnHere = (()=>{
    if(NET.isHost){ if(!HOST.running || !HOST.S) return false; return HOST.mod.myTurn(HOST.S, 0); }
    if(gid === 'ddz') return view.phase==='bid' ? view.turn===mySeat : (view.phase==='play' && view.turn===mySeat);
    if(gid === 'tarot') return view.phase==='bid' ? view.turn===mySeat : (view.phase==='discard' ? view.taker===mySeat : (view.phase==='play' && view.turn===mySeat));
    if(gid === 'mj'){
      if(view.phase === 'que') return view.que && view.que[mySeat] === -1;
      if(view.phase === 'claim') return !!(view.pending && view.pending.claimers && view.pending.claimers.includes(mySeat));
      return view.phase==='play' && view.turn===mySeat;
    }
    if(gid === 'hearts') return view.phase==='play' && view.turn===mySeat;
    if(gid === 'uno') return view.phase==='play' && view.turn===mySeat;
    return view.turn === mySeat;
  })();
  const isChallenge = gid === 'uno' && view.lastPlayWasWild4;
  const canPass = myTurnHere && view.lead && gid !== 'uno' && gid !== 'hearts' && gid !== 'tarot' && gid !== 'mj';
  $('#btnPass').style.display = canPass ? '' : 'none';
  $('#btnPlay').style.display = (myTurnHere || (isChallenge && mySeat === view.turn)) ? '' : 'none';
  $('#btnHint').style.display = myTurnHere ? '' : 'none';
  if(isChallenge && mySeat === view.turn){ $('#btnPlay').style.display = 'none'; $('#btnHint').style.display = 'none'; }
  const A = $('#actions');
  A.innerHTML = '';
  if(isChallenge && mySeat === view.turn){
    const b1 = document.createElement('button'); b1.textContent = '接受 +4（摸 4 张）'; b1.onclick = () => doAction({a:'accept'}); A.appendChild(b1);
    const b2 = document.createElement('button'); b2.className = 'red'; b2.textContent = '挑战 +4'; b2.onclick = () => doAction({a:'challenge'}); A.appendChild(b2);
  }
  if(gid === 'uno' && !myTurnHere && view.phase === 'play'){
    const top = view.top;
    const jumpable = (view.hand||[]).filter(c => {
      if(c.t === 'wild' || c.t === 'wild4') return false;
      if(c.c !== top.c) return false;
      if(c.t === 'num') return top.t === 'num' && c.v === top.v;
      return c.t === top.t;
    });
    if(jumpable.length){
      const b = document.createElement('button'); b.className = 'gold'; b.textContent = '⚡ 抢零';
      b.onclick = () => doAction({a:'jumpin', id: jumpable[0].id});
      A.appendChild(b);
    }
  }
  if(gid === 'mj' && view.phase === 'que' && view.que && view.que[mySeat] === -1){
    ['万','条','筒'].forEach((s, i) => {
      const b = document.createElement('button');
      b.textContent = '定缺：' + s;
      b.onclick = () => doAction({a:'que', s:i});
      A.appendChild(b);
    });
  }
  if(gid === 'tarot' && view.phase === 'bid' && view.turn === mySeat){
    for(let c = view.contract+1; c < 4; c++){
      const b = document.createElement('button');
      b.textContent = '叫：' + CONTRACTS_TAROT[c].name;
      b.onclick = () => doAction({a:'bid', c});
      A.appendChild(b);
    }
  }
  const timerEl = $('#timerBadge');
  const showTimer = myTurnHere && UI.deadline;
  if(showTimer){
    const remain = Math.max(0, Math.ceil((UI.deadline - Date.now())/1000));
    timerEl.textContent = `⏱ ${remain}s`;
    timerEl.style.display = 'block';
    timerEl.classList.toggle('warn', remain <= 10);
  } else timerEl.style.display = 'none';
  if(UI.timerHandle) clearInterval(UI.timerHandle);
  if(showTimer){
    UI.timerHandle = setInterval(() => {
      const r = Math.max(0, Math.ceil((UI.deadline - Date.now())/1000));
      const el = $('#timerBadge');
      if(el){ el.textContent = `⏱ ${r}s`; el.classList.toggle('warn', r<=10); }
      if(r<=0){ clearInterval(UI.timerHandle); UI.timerHandle = null; }
    }, 500);
  }
  if(NET.isHost) $('#netStatus').textContent = '房主 · 权威主机';
  const old = document.querySelector('.pop');
  if(old) old.remove();
  if(view.over){
    const ov = document.createElement('div');
    ov.className = 'pop';
    let txt = '';
    if(gid === 'ddz'){ const w = view.over.winner; txt = `地主${w === view.landlord ? '胜' : '负'}<br>倍数 ×${view.over.mult}`; }
    else if(gid === 'mj'){ txt = '本局结束<br>' + (view.huInfo||[]).map(h => `${names[h.seat]} 胡 ${h.fan}番<br><span style="font-size:11px;color:#8b949e">${(h.tags||[]).join(' ')}</span>`).join('<br>'); }
    else if(gid === 'tarot'){ const o = view.over; txt = `庄家：${names[o.taker]}<br>${CONTRACTS_TAROT[o.contract].name}<br>得分：${o.takerPoints.toFixed(1)} / 需要 ${o.need}<br>${o.diff>=0?'庄家胜':'闲家胜'} · 分数 ${o.score}`; }
    else if(gid === 'hearts'){ txt = '本局结束<br>总分：' + view.over.scores.map((s,i)=>`${names[i]} ${s}`).join('<br>'); }
    else { txt = '本局结束<br>' + (view.over.winners||[]).map(i=>names[i]).join(', ') + ' 胜'; }
    ov.innerHTML = txt + '<br><br>';
    const b = document.createElement('button');
    b.textContent = '返回房间';
    b.onclick = () => { ov.remove(); go('scr-room'); };
    ov.appendChild(b);
    $('#scr-game').appendChild(ov);
  }
}

/* ============================================================
   14. 动作
   ============================================================ */
function doAction(act){
  if(NET.isHost){
    if(!HOST.running || !HOST.S) return;
    const ok = HOST.mod.legal(HOST.S, 0).some(a => sameAct(a, act, HOST.mod, HOST.S));
    if(!ok){ toast('非法动作'); log('非法动作：' + JSON.stringify(act), '#log2'); return; }
    UI.selected.clear();
    HOST.mod.apply(HOST.S, 0, act);
    hostBroadcastViews();
    setTimeout(hostStepAI, 100);
  } else {
    UI.selected.clear();
    NET.toHost({ t:'action', a:act });
  }
}
$('#btnPlay').onclick = () => {
  const v = UI.view; if(!v) return;
  const gid = v.gid;
  if(gid === 'ddz' && v.phase === 'bid'){ doAction({a:'bid'}); return; }
  if(gid === 'tarot' && v.phase === 'bid'){
    const next = v.contract + 1;
    if(next < 4) doAction({a:'bid', c:next});
    return;
  }
  if(gid === 'hearts' || gid === 'tarot'){
    if(UI.selected.size === 0) return toast('请选择一张牌');
    const id = [...UI.selected][0];
    if(gid === 'tarot' && v.phase === 'discard') doAction({a:'discard', id});
    else doAction({a:'play', id});
    return;
  }
  if(gid === 'uno'){
    if(UI.selected.size === 0){ doAction({a:'draw'}); return; }
    const cardId = [...UI.selected][0];
    const card = (v.hand||[]).find(c => c.id===cardId);
    if(card && (card.t==='wild' || card.t==='wild4')){
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = `<div class="box"><div style="margin-bottom:10px">选择颜色</div><div style="display:flex;gap:10px;justify-content:center"><div class="colorbtn" style="background:#e74c3c" data-c="0"></div><div class="colorbtn" style="background:#f1c40f" data-c="1"></div><div class="colorbtn" style="background:#27ae60" data-c="2"></div><div class="colorbtn" style="background:#3498db" data-c="3"></div></div></div>`;
      bg.querySelectorAll('.colorbtn').forEach(b => {
        b.onclick = () => { const color = +b.dataset.c; bg.remove(); doAction({ a:'play', id:cardId, color }); };
      });
      document.body.appendChild(bg);
      return;
    }
    doAction({ a:'play', id:cardId });
    return;
  }
  if(gid === 'mj'){
    if(UI.selected.size === 0) return toast('请选择要出的牌');
    const tile = [...UI.selected][0];
    doAction({ a:'discard', tile });
    return;
  }
  if(UI.selected.size === 0) return toast('请选择要出的牌');
  doAction({ a:'play', ids:[...UI.selected] });
};
$('#btnPass').onclick = () => {
  const v = UI.view; if(!v) return;
  if(v.gid === 'tarot' && v.phase === 'bid') return doAction({a:'pass'});
  doAction({ a:'pass' });
};
$('#btnHint').onclick = () => {
  const v = UI.view; if(!v) return;
  if(NET.isHost){
    if(!HOST.running || !HOST.S) return;
    const L = HOST.mod.legal(HOST.S, 0);
    const plays = L.filter(a => a.a==='play' || a.a==='discard' || a.a==='draw');
    if(!plays.length) return toast('无可提示的动作','info');
    const pick = plays[Math.floor(Math.random() * Math.min(plays.length, 8))];
    UI.selected.clear();
    if(pick.ids) pick.ids.forEach(id => UI.selected.add(id));
    else if(pick.id != null) UI.selected.add(pick.id);
    else if(pick.tile != null) UI.selected.add(pick.tile);
    renderGame(v, 0, HOST.S, UI.deadline);
  } else {
    NET.toHost({ t:'hint' });
  }
};

    tips:['合约倍率：小牌 ×1，卫牌 ×2，无王 ×4，对抗 ×6。','算分：(庄家分 - 需要分 + 25) × 倍率。','愚人留在最后一墩可以保护一张大牌。','愚人任何时候都可以出，跟牌时可以代替跟花色。'] },
};
function showRules(gid){
  const r = RULES[gid]; if(!r) return;
  $('#rulesTitle').textContent = `📖 ${r.name} · ${r.players}`;
  const li = a => a.map(x => `<li>${x}</li>`).join('');
  $('#rulesBody').innerHTML = `<h4>🎯 目标</h4><div>${r.goal}</div><h4>📜 基础规则</h4><ul>${li(r.basic)}</ul><h4>🃏 牌型 / 计分</h4><ul>${li(r.types)}</ul><h4>💡 提示</h4>${r.tips.map(t => `<div class="tip">${t}</div>`).join('')}`;
  $('#rulesModal').style.display = 'flex';
}
$('#rulesClose').onclick = () => $('#rulesModal').style.display = 'none';
$('#rulesModal').onclick = e => { if(e.target.id==='rulesModal') $('#rulesModal').style.display = 'none'; };
$('#btnRules').onclick = () => {
  const gid = (UI.view && UI.view.gid) || $('#gid').value;
  showRules(gid);
};

/* ============================================================
   16. 启动
   ============================================================ */
function randomRid(){
  const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
  let s = '';
  for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
$('#btnRandomRid').onclick = () => { $('#rid').value = randomRid(); };
$('#btnCreate').onclick = async () => {
  const gid = $('#gid').value;
  const ridRaw = $('#rid').value.trim();
  if(!validRoomId(ridRaw)) return toast('房间号必须是 4-8 位字母或数字');
  const normRid = normalizeRoomId(ridRaw);
  const nick = ($('#nick').value || '房主').slice(0, 10);
  HOST.gid = gid;
  HOST.seats = [{ name:nick, conn:null, ready:true, connected:true, ai:false }];
  try{
    log('⏳ 正在创建房间「' + normRid + '」…', '#log');
    await NET.createRoom(normRid);
    log('✅ 房间已创建：' + normRid, '#log');
    log('💡 把房间号「' + normRid + '」告诉好友', '#log');
    go('scr-room');
    $('#roomCodeDisplay').value = normRid;
    $('#roomHint').textContent = `把房间号「${normRid}」告诉好友，让他们输入加入`;
    $('#connBadge').textContent = '已连接'; $('#connBadge').className = '';
    log('👑 你是房主。点「开始游戏」开始，或点「加 AI」补足人数。', '#log2');
    hostBroadcastRoom();
  }catch(e){
    NET.isHost = false; NET.roomId = '';
    toast('创建失败：' + (e.message || e));
    log('❌ 创建失败：' + (e.message || e), '#log');
  }
};
$('#btnJoin').onclick = async () => {
  const ridRaw = $('#rid').value.trim();
  if(!validRoomId(ridRaw)) return toast('房间号必须是 4-8 位字母或数字');
  const normRid = normalizeRoomId(ridRaw);
  const nick = ($('#nick').value || '玩家').slice(0, 10);
  log('⏳ 正在连接房间「' + normRid + '」…', '#log');
  try{
    await NET.joinRoom(normRid);
    log('📡 已连接，等待房主确认…', '#log');
    NET.toHost({ t:'join', name:nick });
    go('scr-room');
    $('#roomCodeDisplay').value = normRid;
    $('#roomHint').textContent = `等待房主开始游戏（房间号：${normRid}）`;
    $('#connBadge').textContent = '等待确认'; $('#connBadge').className = 'wait';
    CLIENT.welcomeReceived = false;
    CLIENT.welcomeTimer = setTimeout(() => {
      if(!CLIENT.welcomeReceived){
        toast('加入超时：房主未响应');
        log('❌ 加入超时：房主未响应', '#log');
        try{ NET.hostConn && NET.hostConn.close(); }catch(e){}
        NET.hostConn = null;
        go('scr-menu');
      }
    }, 8000);
  }catch(e){
    toast('加入失败：' + (e.message || e));
    log('❌ 加入失败：' + (e.message || e), '#log');
  }
};
$('#btnSolo').onclick = () => {
  const gid = $('#gid').value;
  const mod = GAMES[gid];
  HOST.gid = gid;
  HOST.seats = [];
  for(let i=0;i<mod.minP;i++) HOST.seats.push({ name: i===0 ? '我' : 'AI-'+i, conn:null, ready:true, connected:true, ai: i!==0 });
  NET.isHost = true; CLIENT.seat = 0;
  HOST.mod = mod; HOST.running = false;
  hostStartGame();
  go('scr-game');
};
$('#btnAddAI').onclick = () => {
  const mod = GAMES[HOST.gid || $('#gid').value];
  if(!NET.isHost) return;
  if(HOST.seats.length >= mod.maxP) return log('房间已满', '#log2');
  const i = HOST.seats.length;
  HOST.seats.push({ name:'AI-'+i, conn:null, ready:true, connected:true, ai:true });
  log('🤖 已添加 AI-' + i, '#log2');
  hostBroadcastRoom();
};
$('#btnReady').onclick = () => {
  if(NET.isHost){
    const mod = GAMES[HOST.gid];
    if(HOST.seats.length < mod.minP) return toast('人数不足，至少 ' + mod.minP + ' 人');
    if(!HOST.seats.every(s => s.ready || s.ai || s.connected === false)) return toast('还有玩家未准备');
    hostStartGame();
  } else {
    NET.toHost({ t:'ready', v:true });
    $('#btnReady').disabled = true;
    $('#btnReady').textContent = '✓ 已准备';
  }
};
$('#btnLeave').onclick = $('#btnLeave2').onclick = () => {
  if(NET.hostConn){ try{ NET.toHost({ t:'leave' }); }catch(e){} }
  setTimeout(() => location.reload(), 200);
};
$('#btnCopyRoom').onclick = () => {
  const rid = NET.roomId || $('#roomCodeDisplay').value;
  if(!rid || rid === '————') return;
  const text = `来玩 P2P 牌桌！房间号：${rid}`;
  const done = () => {
    const b = $('#btnCopyRoom');
    const old = b.textContent;
    b.textContent = '✅ 已复制';
    setTimeout(() => b.textContent = old, 1500);
  };
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(() => { log('📋 已复制房间号到剪贴板', '#log2'); done(); }).catch(() => { fallbackCopy(text); done(); });
  } else { fallbackCopy(text); done(); }
};
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); log('📋 已复制', '#log2'); } catch(e){ log('复制失败', '#log2'); }
  ta.remove();
}
log('💡 玩法：', '#log');
log('  1) 输入昵称 + 4-8 位房间号，点「创建房间」', '#log');
log('  2) 把房间号告诉好友，让他们输入同一房间号点「加入房间」', '#log');
log('  3) 房主点「开始游戏」或「加 AI」补足人数', '#log');
log('  4) 每回合 30 秒限时，超时自动过/摸', '#log');
</script>
