      if(s.connected===false){
        d.classList.add('empty');
        d.innerHTML=`<div class="ico">✕</div><div style="flex:1"><div class="nm" style="color:var(--text-dim)">${s.name}</div><div class="sub">已断开</div></div><div class="badge off">离线</div>`
      }else{
        playerCount++;
        const initial=(s.name||'?').charAt(0).toUpperCase();
        let badge='';
        if(s.ai)badge='<span class="badge ai">🤖 AI</span>';
        else if(s.ready)badge='<span class="badge ready">✓ 已准备</span>';
        else badge='<span class="badge wait">等待准备</span>';
        const hostBadge=s.isHost?'<span class="badge host">👑 房主</span>':'';
        d.innerHTML=`<div class="ico">${s.ai?'🤖':initial}</div><div style="flex:1;min-width:0"><div class="nm">${s.name}${isMe?' <span style="font-size:10px;color:var(--btn)">(你)</span>':''}</div><div class="sub">座位 ${s.seat+1}</div></div>${hostBadge}${badge}`;
        if(mySeat===0&&s.ai&&!HOST.running){
          const kb=document.createElement('button');
          kb.className='kickBtn';
          kb.textContent='✕ 踢出';
          kb.onclick=(ev)=>{
            ev.stopPropagation();
            const idx=HOST.seats.findIndex(x=>x.ai&&x.name===s.name);
            if(idx>=0){
              HOST.seats.splice(idx,1);
              log('🗑 已踢出 '+s.name,'#log2');
              hostBroadcastRoom()
            }
          };
          d.appendChild(kb)
        }
      }
      box.appendChild(d)
    });
    for(let i=sorted.length;i<maxP;i++){
      const d=document.createElement('div');
      d.className='seat empty';
      d.innerHTML=`<div class="ico">+</div><div style="flex:1"><div class="nm" style="color:var(--text-dim)">等待加入…</div></div><div class="badge wait">空位</div>`;
      box.appendChild(d)
    }
    $('#roomPlayersCount').textContent=`(${playerCount}/${maxP})`;
    if(mySeat===0){
      $('#btnReady').textContent='开始游戏';
      $('#btnReady').disabled=(playerCount<minP)||!sorted.every(s=>s.ready||s.ai||s.connected===false);
    }else{
      $('#btnReady').textContent=myReady?'✓ 已准备':'准备';
      $('#btnReady').disabled=myReady;
    }
    const vRow=$('#mjVariantRow');
    if(gid==='mj'){vRow.classList.add('on');if(mjVariant)vRow.querySelector('select').value=mjVariant;}
    else vRow.classList.remove('on');
  }catch(e){console.error('[renderSeatList] error:',e);try{log('❌ 玩家列表失败：'+(e.message||e),'#log2')}catch(_){}}
}

function renderGame(view,mySeat,fullS,deadline){
  if(!view)return;
  UI.view=view;UI.seat=mySeat;
  if(deadline)UI.deadline=deadline;
  const gid=view.gid;
  go('scr-game');
  const names=view.names||['P0','P1','P2','P3'];
  renderSeats(view,mySeat,names,gid);

  const C=$('#centerCards'),CI=$('#centerInfo');
  C.innerHTML='';CI.innerHTML='';
  const n=view.counts.length;

  if(gid==='mj'||gid==='hp'){
    if(view.phase==='claim'&&view.pending){
      const d=document.createElement('div');
      d.style.cssText='text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px';
      const title=document.createElement('div');
      title.style.cssText='font-size:12px;color:var(--accent);font-weight:700';
      title.textContent=`⏳ ${names[view.pending.from]} 打出 → 等待响应`;
      d.appendChild(title);
      const bigWrap=document.createElement('div');
      bigWrap.style.cssText='animation:popIn .3s ease-out';
      bigWrap.appendChild(cardEl(view.pending.tile,gid,{big:true}));
      d.appendChild(bigWrap);
      const sub=document.createElement('div');
      sub.style.cssText='font-size:11px;color:var(--text-dim)';
      sub.textContent=(view.pending.claimers||[]).map(i=>names[i]).join('、')+' 可响应';
      d.appendChild(sub);
      C.appendChild(d);
    } else {
      const wrap=document.createElement('div');
      wrap.className='mjArea';
      let hasAny=false;
      for(let i=0;i<n;i++){
        if(i===mySeat)continue;
        const ms=view.melds[i]||[];
        const rv=view.rivers[i]||[];
        if(!ms.length && !rv.length)continue;
        hasAny=true;
        const w=document.createElement('div');
        w.className='mjSeat';
        w.innerHTML=`<div class="label">${names[i]}</div>`;
        const opts=(gid==='mj')?{xs:true}:{tiny:true};
        if(ms.length){
          const mrow=document.createElement('div');
          mrow.className='row1';
          ms.forEach(m=>mrow.appendChild(buildMeldEls(gid,m,opts)));
          w.appendChild(mrow);
        }
        if(rv.length){
          const rrow=document.createElement('div');
          rrow.className='row1';
          rrow.style.marginTop='2px';
          rv.slice(-6).forEach(t=>rrow.appendChild(cardEl(t,gid,{tiny:true})));
          w.appendChild(rrow);
        }
        wrap.appendChild(w);
      }
      if(hasAny)C.appendChild(wrap);
    }
    if(gid==='mj'){
      const rname=view.rule&&view.rule.name?view.rule.name:'四川麻将';
      CI.textContent=`${rname} · 牌墙 ${view.wall}`;
      if(view.rule&&view.rule.needFan>0)CI.innerHTML+=` · 需 ${view.rule.needFan} 番起胡`;
    }else CI.textContent=`牌墙 ${view.wall}`;
  }else if(gid==='hearts'){
    if(view.trick.length){
      const d=document.createElement('div');
      d.innerHTML=`<div style="font-size:11px;color:var(--text-dim);text-align:center">本墩 ${view.trick.length}/4</div>`;
      const row=document.createElement('div');
      row.className='hand-row stack';row.style.justifyContent='center';
      view.trick.forEach(t=>{
        const wrap=document.createElement('div');
        wrap.style.cssText='text-align:center;margin:0 3px';
        wrap.appendChild(cardEl(t.id,'hearts',{big:true}));
        const lb=document.createElement('div');
        lb.style.cssText='font-size:10px;color:var(--text-dim)';
        lb.textContent=names[t.seat];
        wrap.appendChild(lb);
        row.appendChild(wrap)
      });
      d.appendChild(row);C.appendChild(d)
    }else CI.textContent='等待领出…';
    CI.innerHTML+=`<br>总分：${view.scores.map((s,i)=>`${names[i]} ${s}`).join(' · ')}<br><span style="color:var(--accent)">本局：${view.roundScores.map((s,i)=>`${names[i]} ${s}`).join(' · ')} · ${view.heartsBroken?'红桃已破':'红桃未破'}</span>`
  }else if(gid==='uno'){
    const top=view.top;
    const colHex=view.currentColor>=0?UNO_COLORS[view.currentColor]:'#888';
    const d=document.createElement('div');
    d.style.cssText='text-align:center';
    d.innerHTML=`<div style="display:inline-block;background:${colHex};border-radius:10px;padding:8px 18px;font-size:22px;font-weight:800;color:#fff;min-width:60px;box-shadow:0 4px 12px #0008">${unoLabel(top)}</div>`;
    C.appendChild(d);
    CI.innerHTML=`颜色：${view.currentColor>=0?UNO_CNAME[view.currentColor]:'—'} · 牌堆 ${view.deckCount} · ${view.dir>0?'↻':'↺'}<br>${view.counts.map((c,i)=>`${names[i]} ${c}`).join(' · ')}`;
    if(view.lastPlayWasWild4)CI.innerHTML+=`<br><span style="color:#da3633">⚠ ${names[view.lastWild4By]} 出了 +4，${names[view.turn]} 请选择！</span>`
  }else if(gid==='tarot'){
    if(view.trick.length){
      const d=document.createElement('div');
      d.style.textAlign='center';
      d.innerHTML=`<div style="font-size:11px;color:var(--text-dim)">本墩 ${view.trick.length}/4</div>`;
      const row=document.createElement('div');
      row.className='hand-row stack';row.style.justifyContent='center';
      view.trick.forEach(t=>{
        const wrap=document.createElement('div');
        wrap.style.cssText='text-align:center;margin:0 3px';
        wrap.appendChild(cardEl(t.id,'tarot',{big:true}));
        const lb=document.createElement('div');
        lb.style.cssText='font-size:10px;color:var(--text-dim)';
        lb.textContent=names[t.seat];
        wrap.appendChild(lb);
        row.appendChild(wrap)
      });
      d.appendChild(row);C.appendChild(d)
    }else CI.textContent=view.phase==='bid'?'叫牌中…':(view.phase==='discard'?'庄家换底…（需弃 6 张）':'等待领出…');
    if(view.taker>=0)CI.innerHTML+=`<br>庄家：${names[view.taker]} · ${CONTRACTS_TAROT[view.contract]?CONTRACTS_TAROT[view.contract].name:'—'} · 已得 ${view.takerPoints.toFixed(1)} 分`;
    if(view.phase==='discard'&&view.taker===mySeat)CI.innerHTML+=`<br><span style="color:var(--accent)">请选择 6 张牌弃掉</span>`
  }else{
    if(view.phase==='bid')CI.textContent='叫地主中…';
    else if(view.lastPlay){
      const d=document.createElement('div');
      d.style.textAlign='center';
      d.innerHTML=`<div style="font-size:11px;color:var(--text-dim)">${names[view.lastPlay.seat]} 出牌</div>`;
      d.appendChild(buildCardRow(view.lastPlay.ids,gid,{big:true},6));
      C.appendChild(d)
    }else CI.textContent='等待出牌…';
    if(gid==='gd')CI.innerHTML+=`<br>级牌：${view.level}`;
    if(gid==='pdk'&&view.mustSpade3)CI.innerHTML+=`<br><span style="color:var(--accent)">首出必须包含 ♠3</span>`;
    if(gid==='qw')CI.innerHTML+=`<br>牌堆剩余：${view.deckCount} 张`
  }

  const H=$('#handWrap');
  H.innerHTML='';
  const CHUNK=gid==='uno'?8:20;
  const chunkArr=(arr,size)=>{const out=[];for(let i=0;i<arr.length;i+=size)out.push(arr.slice(i,i+size));return out};

  if(gid==='mj'||gid==='hp'){
    const handArr=view.hand||[];
    const handKey=handArr.join(',');
    if(UI._lastHandKey!==handKey){
      UI.selIdx=-1;
      UI._lastHandKey=handKey;
    }
    chunkArr(handArr,CHUNK).forEach((chunk,chunkIdx)=>{
      const row=document.createElement('div');
      row.className='hand-row';
      chunk.forEach((tile,localIdx)=>{
        const globalIdx=chunkIdx*CHUNK+localIdx;
        const el=cardEl(tile,gid,{sel:UI.selIdx===globalIdx});
        el.onclick=()=>{
          UI.selIdx=(UI.selIdx===globalIdx)?-1:globalIdx;
          renderGame(view,mySeat,fullS,UI.deadline);
        };
        row.appendChild(el)
      });
      H.appendChild(row)
    });
    if(gid==='mj'&&view.flowers&&view.flowers[mySeat]&&view.flowers[mySeat].length){
      const fr=document.createElement('div');
      fr.className='hand-row';
      fr.style.marginTop='2px';
      view.flowers[mySeat].forEach(t=>fr.appendChild(cardEl(t,'mj',{tiny:true})));
      H.appendChild(fr);
    }
    if(view.melds&&view.melds[mySeat]&&view.melds[mySeat].length){
      const row=document.createElement('div');
      row.className='hand-row';
      row.style.paddingTop='4px';
      const opts=(gid==='mj')?{xs:true}:{tiny:true};
      view.melds[mySeat].forEach(m=>row.appendChild(buildMeldEls(gid,m,opts)));
      H.appendChild(row)
    }
  }else if(gid==='uno'){
    chunkArr(view.hand||[],CHUNK).forEach(chunk=>{
      const row=document.createElement('div');
      row.className='hand-row';
      chunk.forEach(card=>{
        const el=cardEl(card.id,'uno',{sel:UI.selected.has(card.id),cardObj:card});
        el.onclick=()=>{if(UI.selected.has(card.id))UI.selected.delete(card.id);else{UI.selected.clear();UI.selected.add(card.id)}renderGame(view,mySeat,fullS,UI.deadline)};
        row.appendChild(el)
      });
      H.appendChild(row)
    })
  }else if(gid==='tarot'){
    const isDiscard=view.phase==='discard'&&view.taker===mySeat;
    chunkArr(view.hand||[],CHUNK).forEach(chunk=>{
      const row=document.createElement('div');
      row.className='hand-row stack';
      chunk.forEach(id=>{
        const el=cardEl(id,gid,{sel:UI.selected.has(id)});
        el.onclick=()=>{
          if(isDiscard){
            if(UI.selected.has(id))UI.selected.delete(id);
            else if(UI.selected.size<6)UI.selected.add(id);
          } else {
            if(UI.selected.has(id))UI.selected.delete(id);
            else {UI.selected.clear();UI.selected.add(id)}
          }
          renderGame(view,mySeat,fullS,UI.deadline)
        };
        row.appendChild(el)
      });
      H.appendChild(row)
    })
  }else{
    chunkArr(view.hand||[],CHUNK).forEach(chunk=>{
      const row=document.createElement('div');
      row.className='hand-row stack';
      chunk.forEach(id=>{
        const el=cardEl(id,gid,{sel:UI.selected.has(id)});
        el.onclick=()=>{if(UI.selected.has(id))UI.selected.delete(id);else UI.selected.add(id);renderGame(view,mySeat,fullS,UI.deadline)};
        row.appendChild(el)
      });
      H.appendChild(row)
    })
  }

  const myTurnHere=(()=>{
    if(NET.isHost){if(!HOST.running||!HOST.S)return false;return HOST.mod.myTurn(HOST.S,0)}
    if(gid==='ddz')return view.phase==='bid'?view.turn===mySeat:(view.phase==='play'&&view.turn===mySeat);
    if(gid==='tarot')return view.phase==='bid'?view.turn===mySeat:(view.phase==='discard'?view.taker===mySeat:(view.phase==='play'&&view.turn===mySeat));
    if(gid==='mj'){
      if(view.phase==='que')return view.que&&view.que[mySeat]===-1;
      if(view.phase==='claim')return !!(view.pending&&view.pending.claimers&&view.pending.claimers.includes(mySeat));
      return view.phase==='play'&&view.turn===mySeat
    }
    if(gid==='hp'){
      if(view.phase==='claim')return !!(view.pending&&view.pending.claimers&&view.pending.claimers.includes(mySeat));
      return view.phase==='play'&&view.turn===mySeat
    }
    if(gid==='hearts')return view.phase==='play'&&view.turn===mySeat;
    if(gid==='uno'){
      if(view.lastPlayWasWild4&&view.turn===mySeat)return true;
      return view.phase==='play'&&view.turn===mySeat
    }
    return view.turn===mySeat
  })();

  const isUnoChallenge=gid==='uno'&&view.lastPlayWasWild4&&view.turn===mySeat;
  const isUnoJumpin=gid==='uno'&&!view.lastPlayWasWild4&&view.phase==='play'&&view.turn!==mySeat;
  const canPass=myTurnHere&&((gid==='ddz'&&view.phase==='bid')||(gid==='tarot'&&view.phase==='bid')||(!isUnoChallenge&&!['uno','hearts','tarot','mj','hp'].includes(gid)&&view.lead));
  $('#btnPass').style.display=canPass?'':'none';
  const canShowPlay = myTurnHere && !isUnoChallenge && !((gid==='mj'||gid==='hp')&&(view.phase==='claim'||view.phase==='que'));
  $('#btnPlay').style.display=canShowPlay?'':'none';
  $('#btnHint').style.display=(myTurnHere&&!isUnoChallenge&&view.phase!=='discard')?'':'none';
  if(isUnoChallenge){$('#btnPlay').style.display='none';$('#btnHint').style.display='none'}
  if(gid==='ddz'&&view.phase==='bid'){$('#btnPlay').textContent='叫地主';$('#btnPass').textContent='不叫'}
  else if(gid==='tarot'&&view.phase==='bid'){$('#btnPlay').textContent='叫牌';$('#btnPass').textContent='不叫'}
  else if(gid==='tarot'&&view.phase==='discard'){$('#btnPlay').textContent=`弃牌 (${UI.selected.size}/6)`}
  else if(gid==='uno'){$('#btnPlay').textContent=UI.selected.size?'出牌':'摸牌'}
  else{$('#btnPlay').textContent='出牌';$('#btnPass').textContent='过'}

  const A=$('#actions');
  A.innerHTML='';

  if(isUnoChallenge){
    const b1=document.createElement('button');b1.textContent='接受 +4';b1.onclick=()=>doAction({a:'accept'});A.appendChild(b1);
    const b2=document.createElement('button');b2.className='red';b2.textContent='挑战 +4';b2.onclick=()=>doAction({a:'challenge'});A.appendChild(b2)
  }
  if(isUnoJumpin){
    const top=view.top;
    const jumpable=(view.hand||[]).filter(c=>{
      if(c.t==='wild'||c.t==='wild4')return false;
      if(c.c!==top.c)return false;
      if(c.t==='num')return top.t==='num'&&c.v===top.v;
      return c.t===top.t
    });
    if(jumpable.length){
      const b=document.createElement('button');b.className='gold';b.textContent='⚡ 抢零';
      b.onclick=()=>doAction({a:'jumpin',id:jumpable[0].id});
      A.appendChild(b)
    }
  }
  if(gid==='mj'&&view.phase==='que'&&view.que&&view.que[mySeat]===-1){
    ['万','条','筒'].forEach((s,i)=>{
      const b=document.createElement('button');
      b.textContent='定缺：'+s;
      b.onclick=()=>doAction({a:'que',s:i});
      A.appendChild(b)
    })
  }
  if((gid==='mj'||gid==='hp')&&view.phase==='claim'&&view.pending&&view.pending.claimers&&view.pending.claimers.includes(mySeat)){
    const hints=view.actionHints||[];
    if(hints.some(a=>a.a==='hu')){const b=document.createElement('button');b.className='red';b.textContent='胡牌';b.onclick=()=>doAction({a:'hu'});A.appendChild(b)}
    if(hints.some(a=>a.a==='gang')){const b=document.createElement('button');b.className='gold';b.textContent='杠';b.onclick=()=>doAction({a:'gang'});A.appendChild(b)}
    if(hints.some(a=>a.a==='peng')){const b=document.createElement('button');b.textContent='碰';b.onclick=()=>doAction({a:'peng'});A.appendChild(b)}
    if(view.pending.chiOptions){
      view.pending.chiOptions.forEach((opt,idx)=>{
        const b=document.createElement('button');
        b.className='purple';
        const chStr=opt.map(x=>gid==='mj'?NAMES_MJ[x]:hpName(x)).join('+');
        b.textContent=`吃 ${chStr}`;
        b.onclick=()=>doAction({a:'chi',ids:opt});
        A.appendChild(b)
      })
    }
    const b=document.createElement('button');b.className='gray';b.textContent='过';b.onclick=()=>doAction({a:'pass'});A.appendChild(b)
  }
  if((gid==='mj'||gid==='hp')&&view.phase==='play'&&view.turn===mySeat&&view.actionHints){
    const hints=view.actionHints;
    if(hints.some(a=>a.a==='zimo')){const b=document.createElement('button');b.className='red';b.textContent='自摸';b.onclick=()=>doAction({a:'zimo'});A.appendChild(b)}
    hints.filter(a=>a.a==='agang').forEach(a=>{const b=document.createElement('button');b.className='purple';b.textContent='暗杠 '+(gid==='mj'?NAMES_MJ[a.tile]:hpName(a.tile));b.onclick=()=>doAction({a:'agang',tile:a.tile});A.appendChild(b)});
    hints.filter(a=>a.a==='bugang').forEach(a=>{const b=document.createElement('button');b.className='gold';b.textContent='补杠 '+(gid==='mj'?NAMES_MJ[a.tile]:hpName(a.tile));b.onclick=()=>doAction({a:'bugang',tile:a.tile});A.appendChild(b)});
    if(gid==='mj'&&hints.some(a=>a.a==='riichi')&&view.rule&&view.rule.riichi){const b=document.createElement('button');b.className='red';b.textContent='立直';b.onclick=()=>doAction({a:'riichi'});A.appendChild(b)}
  }
  if(gid==='tarot'&&view.phase==='bid'&&view.turn===mySeat){
    for(let c=view.contract+1;c<4;c++){
      const b=document.createElement('button');
      b.textContent='叫：'+CONTRACTS_TAROT[c].name;
      b.onclick=()=>doAction({a:'bid',c});
      A.appendChild(b)
    }
  }

  const timerEl=$('#timerBadge');
  const showTimer=myTurnHere&&UI.deadline&&!isUnoChallenge;
  if(showTimer){
    const remain=Math.max(0,Math.ceil((UI.deadline-Date.now())/1000));
    timerEl.textContent=`⏱ ${remain}s`;
    timerEl.style.display='block';
    timerEl.classList.toggle('warn',remain<=10)
  }else timerEl.style.display='none';
  if(UI.timerHandle)clearInterval(UI.timerHandle);
  if(showTimer){
    UI.timerHandle=setInterval(()=>{
      const r=Math.max(0,Math.ceil((UI.deadline-Date.now())/1000));
      const el=$('#timerBadge');
      if(el){el.textContent=`⏱ ${r}s`;el.classList.toggle('warn',r<=10)}
      if(r<=0){clearInterval(UI.timerHandle);UI.timerHandle=null}
    },500)
  }
  if(NET.isHost)$('#netStatus').textContent='房主 · 权威主机';

  const old=document.querySelector('.pop');
  if(old)old.remove();
  if(view.over){
    const ov=document.createElement('div');
    ov.className='pop';
    const ovv=view.over;
    let icon='🏆',title='结算',winners='',detail='';
    if(gid==='ddz'){
      const isL=ovv.isLandlordWin;
      icon=isL?'👑':'🌾';title=isL?'地主胜':'农民胜';
      winners='🏅 '+(ovv.winners||[]).map(i=>names[i]).join('、')+' 获胜';
      detail=`倍数 ×${ovv.mult}`;
    }else if(gid==='mj'){
      icon='🀄';title='结算';
      detail=(view.huInfo||[]).map(h=>`${names[h.seat]} 胡 ${h.fan}番 (${(h.tags||[]).join(' ')})`).join('<br>')||'牌墙摸完，无人胡牌';
    }else if(gid==='hp'){
      icon='🌸';
      if(ovv.draw)title='流局';
      else title=names[ovv.winner]+' 获胜';
      if(ovv.winners)winners='🏅 '+ovv.winners.map(i=>names[i]).join('、')+' 获胜';
      if(!ovv.draw)detail=`番数：${ovv.fan||0} (${(ovv.tags||[]).join(' ')})`;
    }else if(gid==='tarot'){
      icon=ovv.takerWin?'👑':'🌾';title=ovv.takerWin?'庄家胜':'闲家胜';
      winners=ovv.takerWin?('🏅 '+names[ovv.taker]+' (庄家) 获胜'):'🌾 闲家方获胜';
      let rankHtml='';
      if(ovv.roundScores&&ovv.roundScores.length===4){
        const order=[0,1,2,3].sort((a,b)=>ovv.roundScores[b]-ovv.roundScores[a]);
        for(let idx=0;idx<order.length;idx++){
          const i=order[idx];
          const rs=ovv.roundScores[i];
          const isTaker=i===ovv.taker;
          const tag=isTaker?'庄家':'闲家';
          const signStr=rs>0?'+':'';
          const rsColor=rs>0?'#238636':(rs<0?'#da3633':'#8b949e');

function doAction(act){
  if(NET.isHost){
    if(!HOST.running||!HOST.S)return;
    const L=HOST.mod.legal(HOST.S,0);
    const ok=L.some(a=>sameAct(a,act,HOST.mod,HOST.S));
    if(!ok){
      UI.selected.clear();
      UI.selIdx=-1;
      toast('非法动作，请重新选牌');
      log('非法动作：'+JSON.stringify(act),'#log2');
      try{renderGame(HOST.mod.view(HOST.S,0),0,HOST.S,UI.deadline)}catch(e){}
      return
    }
    UI.selected.clear();
    UI.selIdx=-1;
    HOST.mod.apply(HOST.S,0,act);
    hostBroadcastViews();
    setTimeout(hostStepAI,100)
  }else{
    UI.selected.clear();
    UI.selIdx=-1;
    NET.toHost({t:'action',a:act})
  }
}
$('#btnPlay').onclick=()=>{
  const v=UI.view;if(!v)return;
  const gid=v.gid;
  if(gid==='ddz'&&v.phase==='bid'){doAction({a:'bid'});return}
  if(gid==='tarot'&&v.phase==='bid'){const next=v.contract+1;if(next<4)doAction({a:'bid',c:next});return}
  if(gid==='tarot'&&v.phase==='discard'){
    const ids=[...UI.selected];
    if(!ids.length)return toast('请选择要弃的牌');
    if(ids.length>6)return toast('最多弃 6 张');
    UI.selected.clear();
    for(const id of ids){
      if(NET.isHost){
        if(HOST.running&&HOST.S){
          const L=HOST.mod.legal(HOST.S,0);
          if(L.some(a=>sameAct(a,{a:'discard',id},HOST.mod,HOST.S))){
            HOST.mod.apply(HOST.S,0,{a:'discard',id})
          }
        }
      } else {
        NET.toHost({t:'action',a:{a:'discard',id}})
      }
    }
    if(NET.isHost){hostBroadcastViews();setTimeout(hostStepAI,100)}
    return
  }
  if(gid==='hearts'||gid==='tarot'){
    if(UI.selected.size===0)return toast('请选择一张牌');
    const id=[...UI.selected][0];
    doAction({a:'play',id});
    return
  }
  if(gid==='uno'){
    if(UI.selected.size===0){doAction({a:'draw'});return}
    const cardId=[...UI.selected][0];
    const card=(v.hand||[]).find(c=>c.id===cardId);
    if(card&&(card.t==='wild'||card.t==='wild4')){
      const bg=document.createElement('div');
      bg.className='modal-bg';
      bg.innerHTML=`<div class="box"><div style="margin-bottom:10px">选择颜色</div><div style="display:flex;gap:10px;justify-content:center"><div class="colorbtn" style="background:#e74c3c" data-c="0"></div><div class="colorbtn" style="background:#f1c40f" data-c="1"></div><div class="colorbtn" style="background:#27ae60" data-c="2"></div><div class="colorbtn" style="background:#3498db" data-c="3"></div></div></div>`;
      bg.querySelectorAll('.colorbtn').forEach(b=>{
        b.onclick=()=>{const color=+b.dataset.c;bg.remove();doAction({a:'play',id:cardId,color})}
      });
      document.body.appendChild(bg);
      return
    }
    doAction({a:'play',id:cardId});
    return
  }
  if(gid==='mj'||gid==='hp'){
    if(UI.selIdx<0)return toast('请选择要出的牌');
    const tile=(v.hand||[])[UI.selIdx];
    if(tile==null){UI.selIdx=-1;return toast('无效选择');}
    UI.selIdx=-1;
    doAction({a:'discard',tile});
    return
  }
  if(UI.selected.size===0)return toast('请选择要出的牌');
  doAction({a:'play',ids:[...UI.selected]})
};
$('#btnPass').onclick=()=>{
  const v=UI.view;if(!v)return;
  if(v.gid==='tarot'&&v.phase==='bid')return doAction({a:'pass'});
  if(v.gid==='ddz'&&v.phase==='bid')return doAction({a:'pass'});
  doAction({a:'pass'})
};
$('#btnHint').onclick=()=>{
  const v=UI.view;if(!v)return;
  if(NET.isHost){
    if(!HOST.running||!HOST.S)return;
    const L=HOST.mod.legal(HOST.S,0);
    const plays=L.filter(a=>a.a==='play'||a.a==='discard'||a.a==='draw');
    if(!plays.length)return toast('无可提示的动作','info');
    const pick=plays[Math.floor(Math.random()*Math.min(plays.length,8))];
    UI.selected.clear();
    UI.selIdx=-1;
    if(pick.ids)pick.ids.forEach(id=>UI.selected.add(id));
    else if(pick.id!=null)UI.selected.add(pick.id);
    else if(pick.tile!=null){
      if(v.gid==='mj'||v.gid==='hp'){
        const idx=(v.hand||[]).indexOf(pick.tile);
        if(idx>=0)UI.selIdx=idx;
      } else {
        UI.selected.add(pick.tile);
      }
    }
    renderGame(v,0,HOST.S,UI.deadline)
  }else{
    NET.toHost({t:'hint'})
  }
};

  HOST.mjVariant=$('#mjVariant').value||'sc';
  HOST.seats=[{name:nick,conn:null,ready:true,connected:true,ai:false}];
  let rid=null,lastErr=null;
  for(let i=0;i<6;i++){
    const candidate=randomRid();
    try{
      log('⏳ 创建房间「'+candidate+'」…','#log');
      await NET.createRoom(candidate);
      rid=candidate;break
    }catch(e){
      lastErr=e;
      log('⚠ 房间号 '+candidate+' 不可用（'+(e.message||e)+'）','#log');
      if(!/占用/.test(e.message||''))break;
      await sleep(300)
    }
  }
  if(!rid){
    NET.isHost=false;NET.roomId='';
    toast('创建失败：'+((lastErr&&lastErr.message)||'未知'));
    log('❌ 创建失败：'+((lastErr&&lastErr.message)||''),'#log');
    return
  }
  go('scr-room');
  $('#roomCodeDisplay').value=rid;
  $('#roomHint').textContent=`把房间号「${rid}」告诉好友`;
  $('#connBadge').textContent='已连接';$('#connBadge').className='';
  log('✅ 房间已创建：'+rid,'#log');
  log('👑 你是房主。点「开始游戏」或「加 AI」补足人数。','#log2');
  if(gid==='mj')log('🀄 麻将规则：'+MJ_RULES[HOST.mjVariant].name,'#log2');
  hostBroadcastRoom()
};

$('#btnJoin').onclick=async()=>{
  const ridRaw=$('#rid').value.trim();
  if(!validRoomId(ridRaw))return toast('房间号必须是 4-8 位字母或数字');
  const normRid=normalizeRoomId(ridRaw);
  const nick=($('#nick').value||'玩家').slice(0,10);
  log('⏳ 连接房间「'+normRid+'」…','#log');
  try{
    await NET.joinRoom(normRid);
    NET.toHost({t:'join',name:nick});
    go('scr-room');
    $('#roomCodeDisplay').value=normRid;
    $('#roomHint').textContent=`等待房主开始（房间号：${normRid}）`;
    $('#connBadge').textContent='等待确认';$('#connBadge').className='wait';
    CLIENT.welcomeReceived=false;
    CLIENT.welcomeTimer=setTimeout(()=>{
      if(!CLIENT.welcomeReceived){
        toast('加入超时：房主未响应');
        try{NET.hostConn&&NET.hostConn.close()}catch(e){}
        NET.hostConn=null;go('scr-menu')
      }
    },15000)
  }catch(e){
    toast('加入失败：'+(e.message||e));
    log('❌ 加入失败：'+(e.message||e),'#log')
  }
};
$('#btnSolo').onclick=()=>{
  const gid=$('#gid').value;
  const mod=GAMES[gid];
  HOST.gid=gid;
  HOST.mjVariant=$('#mjVariant').value||'sc';
  HOST.seats=[];
  for(let i=0;i<mod.minP;i++)HOST.seats.push({name:i===0?'我':'AI-'+i,conn:null,ready:true,connected:true,ai:i!==0});
  NET.isHost=true;CLIENT.seat=0;
  HOST.mod=mod;HOST.running=false;
  hostStartGame();
  go('scr-game')
};
$('#btnAddAI').onclick=()=>{
  const mod=GAMES[HOST.gid||$('#gid').value];
  if(!NET.isHost)return;
  if(HOST.seats.length>=mod.maxP)return log('房间已满','#log2');
  const i=HOST.seats.length;
  HOST.seats.push({name:'AI-'+i,conn:null,ready:true,connected:true,ai:true});
  log('🤖 已添加 AI-'+i,'#log2');
  hostBroadcastRoom()
};
$('#btnReady').onclick=()=>{
  if(NET.isHost){
    const mod=GAMES[HOST.gid];
    if(HOST.seats.length<mod.minP)return toast('人数不足，至少 '+mod.minP+' 人');
    if(!HOST.seats.every(s=>s.ready||s.ai||s.connected===false))return toast('还有玩家未准备');
    hostStartGame()
  }else{
    NET.toHost({t:'ready',v:true});
    $('#btnReady').disabled=true;
    $('#btnReady').textContent='✓ 已准备'
  }
};
$('#btnLeave').onclick=$('#btnLeave2').onclick=()=>{
  if(NET.hostConn){try{NET.toHost({t:'leave'})}catch(e){}}
  setTimeout(()=>location.reload(),200)
};
$('#btnCopyRoom').onclick=()=>{
  const rid=NET.roomId||$('#roomCodeDisplay').value;
  if(!rid||rid==='————')return;
  const text=`来玩 P2P 牌桌！房间号：${rid}`;
  const done=()=>{const b=$('#btnCopyRoom');const old=b.textContent;b.textContent='✅ 已复制';setTimeout(()=>b.textContent=old,1500)};
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>{log('📋 已复制房间号','#log2');done()}).catch(()=>{fallbackCopy(text);done()})
  }else{fallbackCopy(text);done()}
};
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');log('📋 已复制','#log2')}catch(e){log('复制失败','#log2')}
  ta.remove()
}
log('💡 玩法：','#log');
log('  1) 点「创建房间」→ 自动生成房间号（可点📋复制发给好友）','#log');
log('  2) 好友输入该房间号 → 点「加入房间」','#log');
log('  3) 房主点「开始游戏」或「加 AI」补足人数，房间里可✕踢出 AI','#log');
log('  4) 选择「麻将」时，可在下方选择四川 / 广东 / 国标 / 日麻规则','#log');
log('  5) 麻将已含东南西北风中发白、春夏秋冬梅兰竹菊花牌','#log');
log('  6) 麻将手牌可精确选中单张（相同牌也可区分）','#log');
log('  7) 碰/吃/杠的副露显示在玩家卡片中，相同牌叠放','#log');
log('  8) 缺门牌必须先打完（四川麻将）','#log');
log('  9) 右上角 ⛶ 按钮可全屏','#log');
log(' 10) 每回合 30 秒限时，超时自动过/摸','#log');
</script>
